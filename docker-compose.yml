  langfuse-proxy:
    image: python:3.12-slim
    container_name: router-langfuse-proxy-dev
    restart: unless-stopped
    working_dir: /app
    command: sh -c "pip install fastapi uvicorn httpx opentelemetry-proto protobuf && python3 /app/resources/langfuse_proxy.py"
    environment:
      LANGFUSE_PROXY_PORT: 3000
      LANGFUSE_TARGET_URL: https://us.cloud.langfuse.com
    ports:
      - "3000:3000"
    networks:
      - network-dev
    volumes:
      - ./resources:/app/resources

networks:
  network-dev:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:
