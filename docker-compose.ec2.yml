# EC2 production overrides for agent-orchestration-core.
# Usage: docker compose -f docker-compose.yml -f docker-compose.ec2.yml up -d --build
services:
  app:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ENVIRONMENT: production
      WORKERS: "1"
      TRACING_ENABLED: "false"
      PUBLIC_BASE_URL: https://api.uora.com.br
      UORA_OPENAPI_URL: http://host.docker.internal:8099/openapi-v1.json
      UORA_APP_PLATFORM_HTTP_BASE: http://host.docker.internal:8088
