site_name: agent-orchestration-core
site_description: "A self-hostable, multi-tenant agent orchestration platform where every run is pinned to the exact definitions and policies that governed it."
repo_url: https://github.com/marcosvs98/agent-orchestration-core
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

