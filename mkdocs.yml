exclude_docs: |
  /ARCHITECTURE.md
  /Develop/gap-register.md
  /Develop/coverage-incremental-loop.md
  /Develop/dead-code-pipeline.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - neoteroi.mkdocsoad:
      use_pymdownx: true
