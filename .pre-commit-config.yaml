repos:
  - repo: 'https://github.com/pre-commit/pre-commit-hooks'
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: '[A01] Removing trailing whitespace'
        stages:
          - pre-commit
      - id: debug-statements
        name: '[A02] Removing debug statements (pdb, rdb)'
        stages:
          - pre-commit
      - id: end-of-file-fixer
        name: '[A03] Ensuring files end with a single newline'
        stages:
          - pre-commit
      - id: check-executables-have-shebangs
        name: '[A04] Ensuring non-binary executables have a shebang'
        stages:
          - pre-commit
      - id: check-builtin-literals
        name: '[A05] Requiring literal syntax when initializing Python builtins'
        stages:
          - pre-commit
      - id: check-vcs-permalinks
        name: '[A06] Ensuring links to repositories (VCS) are permalinks'
        stages:
          - pre-commit
      - id: destroyed-symlinks
        name: '[A07] Detecting symlinks turned into regular files'
        stages:
          - pre-commit
      - id: detect-private-key
        name: '[A08] Detecting committed private keys'
        stages:
          - pre-commit
      - id: fix-byte-order-marker
        name: '[A09] Removing the UTF-8 byte order marker'
        stages:
          - pre-commit
      - id: forbid-new-submodules
        name: '[A10] Preventing new git submodules from being added'
        stages:
          - pre-commit
      - id: forbid-submodules
        name: '[A11] Forbidding any submodule in the repository'
        stages:
          - pre-commit
      - id: no-commit-to-branch
        name: '[A12] Blocking commits to protected branches'
        stages:
          - pre-commit
          - pre-push
        args:
          - '--branch'
          - main
          - '--branch'
          - master
      - id: sort-simple-yaml
        name: '[A13] Sorting simple YAML files while preserving comments'
        stages:
          - pre-commit
      - id: pretty-format-json
        name: '[A14] Formatting JSON files to a fixed style'
        stages:
          - pre-commit
        args:
          - '--indent=4'
          - '--no-ensure-ascii'
          - '--autofix'
      - id: check-json
        name: '[A15] Checking JSON files for valid syntax'
        stages:
          - pre-commit
      - id: check-toml
        name: '[A16] Checking TOML files for valid syntax'
        stages:
          - pre-commit
      - id: check-added-large-files
        name: '[A17] Checking whether large files were added'
        stages:
          - pre-commit
      - id: check-xml
        name: '[A18] Checking XML files for valid syntax'
        stages:
          - pre-commit
      - id: check-yaml
        name: '[A19] Checking YAML files for valid syntax'
        stages:
          - pre-commit
        args:
          - '--unsafe'
      - id: check-case-conflict
        name: '[A20] Checking for filenames that clash on case-insensitive filesystems'
        stages:
          - pre-commit
      - id: check-merge-conflict
        name: '[A21] Checking for merge conflict markers'
        stages:
          - pre-commit
      - id: check-symlinks
        name: '[A22] Checking for symlinks that point nowhere'
        stages:
          - pre-commit
      - id: check-ast
        name: '[A23] Checking that Python files parse'
        stages:
          - pre-commit
      - id: name-tests-test
        name: '[A25] Checking that test files are named correctly'
        stages:
          - pre-commit
        args:
          - '--pytest-test-first'
        exclude: (mocks/|/tests/mocks/|/validation_integration/(evidence|helpers)\.py$|_doubles\.py$).*
  - repo: local
    hooks:
      - id: mypy
        name: '[B01] Checking static types in Python code'
        entry: mypy
        language: system
        types:
          - python
        args:
          - '--namespace-packages'
          - '--explicit-package-bases'
          - '--disallow-untyped-defs'
          - '--warn-unused-ignores'
          - '--cache-dir=.mypy_cache'
        exclude: ^(tests/|src/.*/migrations/)
  - repo: 'https://github.com/astral-sh/ruff-pre-commit'
    rev: v0.14.10
    hooks:
      - id: ruff-format
        name: '[B02] Formatting code automatically (ruff format)'
        stages:
          - pre-commit
        exclude: ^src/tests/
      - id: ruff
        name: '[B03] Analysing code quality (ruff check)'
        stages:
          - pre-commit
        args:
          - '--fix'
          - '--unsafe-fixes'
        exclude: ^src/tests/
  - repo: local
    hooks:
      - id: markdown-links
        name: '[B05] Checking markdown links across the repository'
        entry: python resources/scripts/check_markdown_links.py
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-commit
  - repo: local
    hooks:
      - id: pylint
        name: '[B04] Analysing Python code quality and best practices'
        entry: pylint
        language: system
        types:
          - python
        args:
          - '--rcfile=.pylintrc'
          - '--output-format=colorized'
        exclude: ^(src/tests/|resources/scripts/|src/infra/database/migrations/)

default_install_hook_types:
  - commit-msg
  - post-commit
  - pre-commit
  - pre-push
  - prepare-commit-msg
exclude: ^resources/
