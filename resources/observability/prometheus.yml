global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector-pipeline
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          source: aoc

  - job_name: otel-collector-internal
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          source: collector

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
