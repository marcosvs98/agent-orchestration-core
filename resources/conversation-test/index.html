<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversation SSE Test</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 1rem; background: #1a1a1a; color: #e0e0e0; min-height: 100vh; }
    h1 { font-size: 1.25rem; margin-bottom: 1rem; }
    label { display: block; margin-top: 0.75rem; margin-bottom: 0.25rem; font-size: 0.875rem; color: #a0a0a0; }
    input[type="text"], input[type="password"], textarea { width: 100%; padding: 0.5rem; border: 1px solid #404040; border-radius: 6px; background: #2a2a2a; color: #e0e0e0; font-size: 0.875rem; }
    textarea { min-height: 60px; resize: vertical; }
    button { margin-top: 0.75rem; padding: 0.5rem 1rem; background: #0d7377; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 0.875rem; }
    button:hover { background: #0e8488; }
    button:disabled { background: #404040; cursor: not-allowed; }
    .chat { margin-top: 1.5rem; border: 1px solid #404040; border-radius: 8px; background: #242424; min-height: 200px; max-height: 50vh; overflow-y: auto; padding: 0.75rem; }
    .msg { margin-bottom: 0.75rem; padding: 0.5rem 0.75rem; border-radius: 8px; max-width: 90%; }
    .msg.user { background: #0d7377; margin-left: 0; margin-right: auto; }
    .msg.assistant { background: #2a2a2a; border: 1px solid #404040; margin-left: auto; margin-right: 0; white-space: pre-wrap; word-break: break-word; }
    .msg .meta { font-size: 0.7rem; color: #808080; margin-bottom: 0.25rem; }
    .stream-log { margin-top: 1rem; font-size: 0.75rem; color: #808080; border: 1px solid #333; border-radius: 6px; padding: 0.5rem; max-height: 180px; overflow-y: auto; }
    .stream-log summary { cursor: pointer; }
    .stream-log pre { margin: 0.25rem 0; white-space: pre-wrap; word-break: break-all; }
    .error { color: #e57373; }
    .api-url { font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>Conversation SSE Test</h1>
  <label for="apiUrl">API base URL</label>
  <input type="text" id="apiUrl" value="http://localhost:8000" class="api-url" placeholder="http://localhost:8000">
  <label for="token">JWT token</label>
  <input type="password" id="token" placeholder="Paste Bearer token (without 'Bearer ')">
  <label for="userInput">Message</label>
  <textarea id="userInput" placeholder="Type your message..."></textarea>
  <button id="sendBtn" type="button">Send</button>

  <div class="chat" id="chat"></div>
  <details class="stream-log" id="streamLog">
    <summary>Stream events (raw)</summary>
    <pre id="streamPre"></pre>
  </details>

  <script>
    const API_IDS = {
      flow_id: '00000000-0000-0000-0000-000000000700',
      flow_version_id: '00000000-0000-0000-0000-000000000701',
      session_id: '4a77dbf0-af03-4bee-9382-17aac00da302',
      user_id: 'marcosteste'
    };

    const chatEl = document.getElementById('chat');
    const streamPre = document.getElementById('streamPre');
    const streamLog = document.getElementById('streamLog');
    const sendBtn = document.getElementById('sendBtn');
    const tokenEl = document.getElementById('token');
    const userInputEl = document.getElementById('userInput');
    const apiUrlEl = document.getElementById('apiUrl');

    function appendChat(role, text, meta = '') {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      if (meta) {
        const m = document.createElement('div');
        m.className = 'meta';
        m.textContent = meta;
        div.appendChild(m);
      }
      div.appendChild(document.createTextNode(text));
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    function startAssistantStreamMessage() {
      const messageEl = appendChat('assistant', '', 'assistant');
      const textNode = document.createTextNode('');
      const typingEl = document.createElement('span');
      typingEl.textContent = ' typing...';
      typingEl.dataset.typing = 'true';
      messageEl.appendChild(textNode);
      messageEl.appendChild(typingEl);
      return { messageEl, textNode, typingEl };
    }

    function finishAssistantStreamMessage(state) {
      if (!state || !state.messageEl) return;
      if (state.typingEl && state.typingEl.parentNode) {
        state.typingEl.parentNode.removeChild(state.typingEl);
      }
      if (!state.textNode.nodeValue.trim()) {
        state.textNode.nodeValue = '(No streamed content from provider.)';
      }
    }

    function appendStreamLine(line) {
      streamPre.textContent += line + '\n';
      streamLog.open = true;
      const el = document.getElementById('streamPre');
      if (el) el.scrollTop = el.scrollHeight;
    }

    function clearStreamLog() {
      streamPre.textContent = '';
    }

    async function sendMessage() {
      const token = tokenEl.value.trim();
      const message = userInputEl.value.trim();
      const baseUrl = apiUrlEl.value.trim().replace(/\/$/, '');

      if (!token) {
        appendChat('assistant', 'Error: JWT token is required.', 'error');
        return;
      }
      if (!message) {
        appendChat('assistant', 'Error: Message cannot be empty.', 'error');
        return;
      }

      appendChat('user', message);
      userInputEl.value = '';
      sendBtn.disabled = true;
      clearStreamLog();

      const url = baseUrl + '/core/v1/conversations';
      const body = {
        flow_id: API_IDS.flow_id,
        flow_version_id: API_IDS.flow_version_id,
        session_id: API_IDS.session_id,
        user_id: API_IDS.user_id,
        user_input: message,
        metadata: {}
      };

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'text/event-stream',
            'Authorization': 'Bearer ' + token,
            'Idempotency-Key': 'web-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9)
          },
          body: JSON.stringify(body)
        });

        if (!res.ok) {
          const errText = await res.text();
          appendChat('assistant', 'HTTP ' + res.status + ': ' + (errText || res.statusText), 'error');
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let assistantReply = '';
        let streamState = null;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          let eventType = '';
          let dataLine = '';

          for (const line of lines) {
            if (line.startsWith('event:')) {
              eventType = line.slice(6).trim();
              appendStreamLine(line);
            } else if (line.startsWith('data:')) {
              dataLine = line.slice(5).trim();
              appendStreamLine(line);
              if (dataLine && eventType === 'content_delta') {
                try {
                  const data = JSON.parse(dataLine);
                  const delta = data?.delta;
                  if (typeof delta === 'string' && delta.length > 0) {
                    if (!streamState) {
                      streamState = startAssistantStreamMessage();
                    }
                    streamState.textNode.nodeValue += delta;
                    chatEl.scrollTop = chatEl.scrollHeight;
                  }
                } catch (_) {}
              }
              if (dataLine && eventType === 'flow_completed') {
                try {
                  const data = JSON.parse(dataLine);
                  const payload = data?.payload?.payload;
                  const systemOutput = payload?.system_output;
                  if (systemOutput != null) {
                    assistantReply = typeof systemOutput === 'string' ? systemOutput : JSON.stringify(systemOutput);
                  }
                } catch (_) {}
              }
            } else if (line.trim() === '') {
              eventType = '';
              dataLine = '';
            }
          }
        }

        if (buffer.trim()) {
          appendStreamLine(buffer);
        }

        if (assistantReply) {
          if (streamState) {
            streamState.textNode.nodeValue = assistantReply;
            finishAssistantStreamMessage(streamState);
          } else {
            appendChat('assistant', assistantReply);
          }
        } else {
          if (streamState) {
            finishAssistantStreamMessage(streamState);
          } else {
            appendChat('assistant', '(No system_output in flow_completed; check stream events.)');
          }
        }
      } catch (err) {
        appendChat('assistant', 'Error: ' + (err.message || String(err)), 'error');
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    userInputEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
