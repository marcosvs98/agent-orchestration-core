name: Deploy AOC

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aoc-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TRACING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Ruff
        run: uv run ruff check src

      - name: Run tests
        run: uv run python -m pytest tests/unit tests/integration -m "not validation_integration"

      - name: Vulture vs baseline
        run: |
          bash support/scripts/quality/vulture_report.sh
          bash support/scripts/quality/vulture_diff.sh

  deploy:
    needs: test
    runs-on: [self-hosted, uora-ec2]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Deploy
        run: |
          set -euo pipefail
          cd /opt/uora/agent-orchestration-core
          bash deploy/deploy.sh
