    "*/domain/rag/services/rag_service.py",
    "*/domain/tenants/controllers/tenants_controller.py",
    "*/adapters/jobs/arq_embedding_queue.py",
    "*/domain/rag/services/embedding_adapter_factory.py",
    "*/infra/database/dependencies.py",
    "*/domain/governance/services/access_policy_service.py",
    "*/services/execution_boundary.py",
    "*/domain/tools/controllers/tools_controller.py",
    "*/domain/onboarding/controllers/onboarding_controller.py",
    "*/domain/llm/services/llm_executor.py",
    "*/domain/rag/services/embedding_provider_selector.py",
    "*/domain/governance/services/execution_limit_service.py",
