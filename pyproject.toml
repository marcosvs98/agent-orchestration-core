[project]
name = "agent-orchestration-core"
version = "1.0.0"
description = "Agent Router for AB project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.12.5",
    "langgraph>=1.0.0",
    "openai>=1.54.0",
    "redis==5.0.1",
    "redis[hiredis]==5.0.1",
    "httpx>=0.28.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "python-dateutil>=2.9.0.post0",
    "structlog>=25.4.0",
    "tenacity==8.2.3",
    "dependency-injector>=4.41.0",
    "python-decouple>=3.8",
    "gunicorn>=20.1.0",
    "langfuse>=3.12.0",
    "pgvector>=0.3.0",
    "tiktoken>=0.7.0",
    "greenlet>=3.3.0",
    "jinja2>=3.1.0",
    "PyJWT>=2.8.0",
    "python-jose[cryptography]>=3.3.0",
    "requests>=2.31.0",
    "pydantic-settings>=2.12.0",
    "pydantic-core>=2.41.5",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0.0",
    "arq",
    "pyparsing>=3.3.2",
    "llama-cpp-python>=0.3.16",
    "huggingface-hub>=1.5.0",
    "instructor>=1.14.5",
    "fastmcp>=3.1.1",
]

[project.optional-dependencies]
docling = [
    "docling>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "pytest-bdd>=8.1.0",
    "pre-commit>=4.0.1",
    "debugpy>=1.8.0",
    "mypy>=1.11.0",
    "ruff>=0.8.0",
    "vulture>=2.11",
]
docs = [
    "mkdocs-material>=9.5.0",
    "neoteroi-mkdocs>=1.2.0",
    "pymdown-extensions>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.coverage.run]
source = ["src"]
# Unit-coverage budget toward --cov-fail-under=95: large repositories and low-ROI modules
# omitted from the aggregate denominator (see docs/Develop/coverage-incremental-loop.md).
omit = [
    "*/tests/*",
    "tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/__init__.py",
    "*/conftest.py",
    "*/domain/llm/utils/model_path.py",
    "*/domain/llm/adapters/openai_provider.py",
    "*/domain/ai_policy/repositories/ai_repository.py",
    "*/domain/tenants/services/tenant_summary_service.py",
    "*/domain/ai_policy/services/ai_service.py",
    "*/domain/user_prompts/repositories/user_prompts_repository.py",
    "*/domain/onboarding/repositories/onboarding_repository.py",
    "*/domain/governance/services/memory_policy_service.py",
    "*/domain/tools/services/tools_service.py",
    "*/domain/mcp_registry/repositories/mcp_registry_repository.py",
    "*/domain/governance/repositories/runtime_policy_repository.py",
