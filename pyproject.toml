[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/bdd"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--ignore=tests/unit/validation",
    "--ignore=tests/unit/execution/test_langfuse_enforcement.py",
    "--ignore=tests/unit/llm/test_provider_selector.py",
    "--ignore=tests/unit/observability/test_langfuse_tracer.py",
    "--ignore=tests/unit/pkg/domain/ai_policy/test_ai_service.py",
    "--ignore=tests/unit/pkg/domain/context/test_memory_extraction_processor.py",
    "--ignore=tests/unit/pkg/domain/context/test_memory_writer.py",
    "--ignore=tests/unit/pkg/domain/tenants/test_tenant_operational_summary.py",
    "--ignore=tests/unit/pkg/domain/tools/test_tool_catalog_retriever.py",
    "--ignore=tests/unit/pkg/domain/tools/test_tools_service.py",
    "--ignore=tests/unit/pkg/infra/test_planning9_models.py",
    "--ignore=tests/unit/runtime/test_llm_node_executor_extra_system_context.py",
    "-m",
    "not validation_integration",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=95",
]
markers = [
    "unit: unit tests",
    "integration: tests requiring external services or full stack",
    "e2e: end-to-end tests",
    "slow: slow tests",
    "validation_integration: runs validation suite against docker-compose services",
    "bdd: Gherkin scenarios (pytest-bdd) for behaviour examples",
    "m1: milestone 1 behaviour slice",
    "smoke: quick smoke slice",
]

[tool.mypy]
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
disallow_untyped_defs = true
warn_unused_ignores = true
cache_dir = ".mypy_cache"
mypy_path = "src"
ignore_missing_imports = true
follow_imports = "skip"
exclude = "^(tests/|src/.*/migrations/)"

[[tool.mypy.overrides]]
module = [
    "openai.*",
    "structlog.*",
    "sqlalchemy.*",
    "langgraph.*",
    "langchain.*",
    "redis.*",
    "httpx.*",
    "asyncpg.*",
    "alembic.*",
    "langfuse.*",
    "opentelemetry.*",
    "decouple",
    "examples.*",
    "templates.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pre-commit>=4.0.1",
    "pylint>=4.0.4",
    "pytest-bdd>=8.1.0",
    "mypy>=1.11.0",
    "ruff>=0.8.0",
    "vulture>=2.11",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
exclude = [
    ".venv",
    "build",
    "dist",
    "**/migrations/**",
]

[tool.ruff.lint]
# Pyflakes + pycodestyle errors only; expand gradually (see docs/Develop/dead-code-pipeline.md).
select = ["E9", "F"]
ignore = []

[tool.vulture]
min_confidence = 80
paths = ["src"]
exclude = ["**/migrations/**", "**/__pycache__/**"]
