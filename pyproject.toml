[project]
name = "agent-orchestration-core"
version = "1.0.0"
description = "Agent Router for AB project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.12.5",
    "langgraph>=1.0.0",
    "openai>=1.54.0",
    "redis==5.0.1",
    "redis[hiredis]==5.0.1",
    "httpx>=0.28.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "python-dateutil>=2.9.0.post0",
    "structlog>=25.4.0",
    "tenacity==8.2.3",
    "dependency-injector>=4.41.0",
    "python-decouple>=3.8",
    "gunicorn>=20.1.0",
    "langfuse>=3.12.0",
    "pgvector>=0.3.0",
    "tiktoken>=0.7.0",
    "greenlet>=3.3.0",
    "jinja2>=3.1.0",
    "PyJWT>=2.8.0",
    "python-jose[cryptography]>=3.3.0",
    "requests>=2.31.0",
    "pydantic-settings>=2.12.0",
    "pydantic-core>=2.41.5",
    "jsonschema>=4.0.0",
    "openapi3-parser>=1.1.22",
    "pyyaml>=6.0.0",
    "arq",
    "pyparsing>=3.3.2",
    "llama-cpp-python>=0.3.16",
    "huggingface-hub>=1.5.0",
    "instructor>=1.14.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=4.0.1",
    "debugpy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=95",
]
markers = [
    "validation_integration: runs validation suite against docker-compose services",
]

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
disallow_untyped_defs = true
warn_unused_ignores = true
cache_dir = ".mypy_cache"
mypy_path = "src"
ignore_missing_imports = true
follow_imports = "skip"
exclude = "^(src/tests/|src/.*/migrations/)"

[[tool.mypy.overrides]]
module = [
    "openai.*",
    "structlog.*",
    "sqlalchemy.*",
    "langgraph.*",
    "langchain.*",
    "redis.*",
    "httpx.*",
    "asyncpg.*",
    "alembic.*",
    "langfuse.*",
    "opentelemetry.*",
    "decouple",
    "examples.*",
    "templates.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pylint>=4.0.4",
]
